[package]
name = "superagent"
version = "1.0.0"
edition = "2021"
description = "sa - DeepSeek superagent that runs and manages every agent on this machine"

[[bin]]
name = "sa"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
ureq = "2"
regex = "1"

[profile.release]
opt-level = 2
strip = true
lto = "thin"
